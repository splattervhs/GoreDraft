# Builds the Windows installer, Windows portable zip and Linux package, then
# publishes them as a beta pre-release tagged with APP_VERSION (e.g. v0.2.0).
#
# Start a release by either:
#   * pushing to the `release` branch, or
#   * GitHub -> Actions -> release -> "Run workflow"
# Bump APP_VERSION in goredraft/model.py first, or the release for that
# version gets its files replaced.
name: release

on:
  push:
    branches: [release]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build app
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --windowed --name GoreDraft --icon goredraft\icon.ico `
            --add-data "goredraft\fonts;goredraft\fonts" --add-data "goredraft\icon.png;goredraft" `
            --add-data "goredraft\splash.jpg;goredraft" --add-data "goredraft\manual;goredraft\manual" --collect-data spellchecker run.py
      - name: Build installer
        shell: pwsh
        run: |
          $ver = python -c "from goredraft.model import APP_VERSION; print(APP_VERSION)"
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer\goredraft.iss
          Compress-Archive -Path dist\GoreDraft -DestinationPath "dist\GoreDraft-$ver-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/GoreDraft-Setup-*.exe
            dist/GoreDraft-*-windows-portable.zip

  linux:
    runs-on: ubuntu-22.04   # older glibc = runs on more distros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - name: Build
        run: bash build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/GoreDraft-*-linux-x86_64.tar.gz

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "v=$(python3 -c 'from goredraft.model import APP_VERSION; print(APP_VERSION)')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: GORE DRAFT ${{ steps.ver.outputs.v }} beta
          prerelease: true
          make_latest: true
          body_path: BETA.md
          files: out/**/*
